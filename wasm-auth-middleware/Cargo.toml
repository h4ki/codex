[package]
name = "wasm-auth-middleware"
version = "0.1.0"
edition = "2021"
description = "Rust WebAssembly middleware for GitHub OAuth2 login with PKCE."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
sha2 = "0.10"
url = "2.5"
wasm-bindgen = "0.2"
