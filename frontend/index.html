<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex WebAssembly OAuth</title>
  </head>
  <body>
    <main class="shell">
      <section class="panel">
        <p class="eyebrow">Rust WebAssembly Middleware</p>
        <h1>GitHub OAuth2 Login</h1>
        <p id="status">Bereit fuer die Authentifizierung.</p>
        <div class="actions">
          <button id="login-button" type="button">Mit GitHub anmelden</button>
          <button id="logout-button" type="button" hidden>Abmelden</button>
        </div>
        <pre id="profile" hidden></pre>
      </section>
    </main>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
